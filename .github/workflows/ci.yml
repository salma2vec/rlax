name: DPG full validation
on:
  push:
    branches: ["codex/verify-dpg-20261031"]
permissions:
  contents: read
jobs:
  test-build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native test and documentation dependencies
        run: |
          python -m pip install -U pip uv
          python -m uv pip install --system '.[test,docs]' pytest-xdist build flake8
          python -m pip freeze > validation-environment.txt
      - name: Native Flake8 selector
        run: python -m flake8 rlax --count --select=E9,F63,F7,F82,E225,E251 --show-source --statistics
      - name: Build and install the wheel
        run: |
          python -m build
          python -m pip wheel --no-deps dist/rlax-*.tar.gz
          python -m pip install --force-reinstall --no-deps rlax-*.whl
      - name: Native main test collection
        run: |
          mkdir -p _testing
          cd _testing
          python -m pytest --numprocesses 2 --pyargs rlax -k 'not pop_art_test' --junitxml=../main-tests.xml
      - name: Native PopArt test collection
        if: ${{ !cancelled() }}
        run: |
          mkdir -p _testing
          cd _testing
          python -m pytest --numprocesses 2 --pyargs rlax -k 'pop_art_test' --junitxml=../pop-art-tests.xml
      - name: Native documentation build
        if: ${{ !cancelled() }}
        run: cd docs && make html
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: validation-${{ matrix.python-version }}
          path: |
            *tests.xml
            validation-environment.txt
  lint-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Install native lint dependencies
        run: |
          python -m pip install -U pip uv
          python -m uv pip install --system '.[test]' pylint
          wget -O .pylintrc https://google.github.io/styleguide/pylintrc
          sed -i "s/indent-string.*/indent-string='  '/" .pylintrc
          echo 'disable=unnecessary-lambda-assignment,no-value-for-parameter,use-dict-literal' >> .pylintrc
      - name: Compare complete upstream and candidate diagnostics
        run: |
          cp rlax/_src/policy_gradients.py /tmp/policy_gradients.py
          cp rlax/_src/policy_gradients_test.py /tmp/policy_gradients_test.py
          for variant in baseline candidate; do
            if [ "$variant" = baseline ]; then
              git show 036c859d6be16659db1dce7e4381431149a8eed3:rlax/_src/policy_gradients.py > rlax/_src/policy_gradients.py
              git show 036c859d6be16659db1dce7e4381431149a8eed3:rlax/_src/policy_gradients_test.py > rlax/_src/policy_gradients_test.py
            else
              cp /tmp/policy_gradients.py rlax/_src/policy_gradients.py
              cp /tmp/policy_gradients_test.py rlax/_src/policy_gradients_test.py
            fi
            pylint --rcfile=.pylintrc $(find rlax -name '*.py' ! -name '*_test.py') -d E1102 --output-format=json > "$variant-production.json" || true
            pylint --rcfile=.pylintrc $(find rlax -name '*_test.py') -d W0212,E1130,E1102,E1120 --output-format=json > "$variant-tests.json" || true
          done
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          def diagnostics(variant):
              messages = []
              for path in Path('.').glob(f'{variant}-*.json'):
                  messages.extend(json.loads(path.read_text()))
              return collections.Counter((x['path'], x['symbol'], x['message']) for x in messages)
          before = diagnostics('baseline')
          after = diagnostics('candidate')
          new = after - before
          print('baseline', sum(before.values()), 'candidate', sum(after.values()), 'new', list(new.items()))
          assert not new, 'Candidate adds Pylint diagnostics'
          PY
          git diff --exit-code -- rlax
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pylint-comparison
          path: |
            baseline-*.json
            candidate-*.json
